<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PariView 브랜드</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="teamsparta.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>main{max-width:1050px;padding:50px 25px}a{color:#003cdc}h1{text-align:center;font-size:36px;line-height:1.5;margin:50px 0 20px;letter-spacing:-1px}.brand-preview{display:flex;justify-content:center;align-items:center;margin:50px auto;gap:20px}.brand-preview .brand-symbol{width:120px;height:90px}.brand-preview .brand-wordmark{width:300px;height:90px}.characters{display:flex;justify-content:center;gap:60px}.character{width:280px;height:360px}.character canvas{width:100%;height:100%}p{text-align:center;color:#6b7684;font-size:16px;line-height:1.8}footer{text-align:center;padding:35px}@media(max-width:700px){.characters{gap:5px}.character{width:48%;height:250px}.brand-preview{gap:10px}.brand-preview .brand-symbol{width:70px}.brand-preview .brand-wordmark{width:210px}}</style></head><body><main><a href="./">← PariView로 돌아가기</a><h1>나에게 맞춰 보는 시선</h1><p>안경을 맞추듯 비교하고<br>필요할 때 다시 맞추는 시청 경험</p><div class="brand-preview"><span class="brand-symbol" id="symbol" data-tone="dark"><img src="assets/pariview-symbol.svg" alt="안경 심벌"><canvas></canvas></span><span class="brand-symbol brand-wordmark" id="wordmark" data-wordmark="true" data-tone="dark"><img src="assets/pariview-wordmark.svg" alt="PariView"><canvas></canvas></span></div><div class="characters"><div id="falcon" class="character" role="img" aria-label="안경 쓴 매"><canvas></canvas></div><div id="wizard" class="character" role="img" aria-label="마법사 매"><canvas></canvas></div></div><footer><p>Three.js로 만든 입체 심벌과 캐릭터<br>마우스를 올리면 가볍게 인사해요</p></footer></main><script type="module">import{createBrand}from './brand.js';import{createFalcon}from './mascot.js';const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;createBrand(document.querySelector('#symbol'),reduced);createBrand(document.querySelector('#wordmark'),reduced);createFalcon(document.querySelector('#falcon'),{reduced});createFalcon(document.querySelector('#wizard'),{wizard:true,reduced});</script></body></html>
