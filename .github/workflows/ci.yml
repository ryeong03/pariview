name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check (web, extension)
        run: |
          for f in web/dist/*.js extension/*.js; do node --check "$f"; done
          python -m json.tool extension/manifest.json > /dev/null

      - name: Adaptive fitting engine (node:test)
        run: node --test web/test_adaptive_fit.mjs

      - name: Recommendation API (unittest)
        run: python -m unittest ai.test_recommendation ai.test_experience_http ai.test_static_gzip -v

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pariview:ci .
      - name: Start container and check health
        run: |
          docker run -d --name pariview -p 8080:8080 pariview:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS http://127.0.0.1:8080/api/recommendation/status
      - name: Container logs
        if: always()
        run: docker logs pariview || true
